<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Moved</title>
<script>
  // Every BlufoxMobile tool moved behind the team site. An old
  // blufoxmobile.github.io/<Tool>/... link lands here and is sent to the same
  // path on the new address, which asks for the team password first.
  (function () {
    var path = location.pathname.replace(/^\/+/, '');
    location.replace('https://cookcountycooks.com/t/' + path + location.search + location.hash);
  })();
</script>
</head>
<body></body>
</html>
